{% extends "base.html" %}

{% block title %}登录 · 耶稣爱你.胜利{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
  <div class="auth-page">
    <div class="container auth-grid">
      <section class="auth-aside" aria-labelledby="auth-welcome">
        <h1 id="auth-welcome">耶稣爱你</h1>
        <p class="auth-aside-copy">基督教信息分享网站</p>
        <span class="auth-cross" aria-hidden="true">✝</span>
      </section>

      <section class="auth-card" aria-labelledby="login-heading">
        <p class="auth-mobile-brand">耶稣爱你 · 基督教信息分享网站</p>
        <h2 id="login-heading">登录社区</h2>

        <form method="post" action="{{ url_for('login') }}" class="stack-form" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="method" value="phone">
          <input type="hidden" name="next" value="{{ next_url }}">

          <div class="auth-panel" id="phone-panel">
            <div class="form-field">
              <label for="login-phone">手机号</label>
              <input
                type="tel"
                id="login-phone"
                name="phone"
                value="{{ form.phone }}"
                placeholder="请输入 11 位手机号"
                inputmode="numeric"
                autocomplete="tel"
                pattern="1[3-9][0-9]{9}"
                maxlength="11"
              >
            </div>

            <div class="form-field">
              <label for="login-code">短信验证码</label>
              <div class="code-row">
                <input
                  type="text"
                  id="login-code"
                  name="code"
                  placeholder="6 位验证码"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  pattern="[0-9]{6}"
                  maxlength="6"
                >
                <button
                  type="button"
                  class="btn btn--ghost btn--small code-send-button"
                  data-send-code-url="{{ url_for('send_login_sms_code') }}"
                >获取验证码</button>
              </div>
              <p class="field-hint field-status" data-sms-status role="status" aria-live="polite"></p>
            </div>
          </div>

          <button type="submit" class="btn btn--primary btn--block">登录</button>
        </form>
      </section>
    </div>
  </div>
{% endblock %}
